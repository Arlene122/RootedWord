<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Deeper</title>
<meta name="description" content="Read, see and study the Bible.">
<meta name="theme-color" content="#FBF8F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deeper">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #F7F3EC; overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
  body { font-family: Inter, system-ui, sans-serif; color: #2A2520; padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #app { position: absolute; top: env(safe-area-inset-top); transform-origin: 0 0; display: none; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #auth { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; overflow-y: auto; }
  .acard { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 52px; height: 52px; border-radius: 14px; }
  .brand h1 { margin: 0; font: 600 30px 'Source Serif 4', Georgia, serif; }
  .brand p { margin: 2px 0 0; font: 500 13px Inter, sans-serif; color: #6B6255; }
  #auth form { display: none; flex-direction: column; gap: 10px; }
  #auth h2 { margin: 0 0 4px; font: 600 20px 'Source Serif 4', Georgia, serif; }
  #auth label { font: 600 12px Inter, sans-serif; color: #6B6255; display: flex; flex-direction: column; gap: 5px; }
  #auth input { height: 48px; border: 1px solid #E0D6C5; border-radius: 12px; padding: 0 14px; background: #FFFDF8; font: 500 16px Inter, sans-serif; color: #2A2520; outline: none; }
  #auth input:focus { border-color: #1F5E5B; }
  #auth button[type=submit] { height: 50px; border: none; border-radius: 14px; background: #1F5E5B; color: #F7F3EC; font: 600 16px Inter, sans-serif; margin-top: 4px; }
  .alinks { display: flex; justify-content: space-between; gap: 8px; }
  .alinks a { font: 600 13px Inter, sans-serif; color: #1F5E5B; text-decoration: none; padding: 8px 0; }
  .amsg { font: 500 13px/1.45 Inter, sans-serif; color: #2B7A63; min-height: 18px; }
  .amsg.bad { color: #8A2943; }
  .afoot { font: 500 11px/1.5 Inter, sans-serif; color: #8A7F70; text-align: center; }
</style>
</head>
<body>
<div id="auth">
  <div class="acard">
    <div class="brand"><img src="icons/icon-192.png" alt=""><div><h1>Deeper</h1><p>Read, see and study the Bible</p></div></div>
    <div id="amsg" class="amsg"></div>
    <form id="f-signin" autocomplete="on">
      <h2>Sign in</h2>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
      <div class="alinks"><a href="#" data-go="forgot">Forgot password?</a><a href="#" data-go="signup">Create account</a></div>
    </form>
    <form id="f-signup" autocomplete="on">
      <h2>Create account</h2>
      <label>Username<input name="username" autocomplete="username" autocapitalize="none" required placeholder="e.g. arlene"></label>
      <label>Your name<input name="dname" autocomplete="name" placeholder="Shown on your profile"></label>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <label>Password<input name="password" type="password" autocomplete="new-password" minlength="6" required></label>
      <button type="submit">Create account</button>
      <div class="alinks"><a href="#" data-go="signin">I have an account</a></div>
    </form>
    <form id="f-forgot">
      <h2>Reset password</h2>
      <label>Email<input name="email" type="email" autocomplete="email" required></label>
      <button type="submit">Send reset link</button>
      <div class="alinks"><a href="#" data-go="signin">Back to sign in</a></div>
    </form>
    <form id="f-reset">
      <h2>Choose a new password</h2>
      <label>New password<input name="password" type="password" autocomplete="new-password" minlength="6" required></label>
      <label>Type it again<input name="password2" type="password" autocomplete="new-password" minlength="6" required></label>
      <button type="submit">Save password</button>
    </form>
    <div class="afoot">Scripture text: King James Version (public domain). NLT © Tyndale House Foundation.</div>
  </div>
</div>
<div id="app"></div>

irection: column; gap: 12px\">\n          <div style=\"font: 400 13px/1.5 Inter, sans-serif; color: #5A5145\">Short recall cards from your topics and highlights come back at growing intervals, so what you study sticks.</div>\n          <div style=\"background: #2A2520; color: #F7F3EC; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px\">\n            <div style=\"font: 600 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #F2C66B\">Recall \u00b7 {{due}} due</div>\n            <div style=\"font: 600 18px/1.35 'Source Serif 4', Georgia, serif\">What did Abraham tell Isaac that God would provide?</div>\n            <sc-if value=\"{{reveal}}\" hint-placeholder-val=\"{{false}}\">\n              <div style=\"font: italic 400 16px/1.5 'Source Serif 4', Georgia, serif; color: #F2E3C4\">\u201cGod will provide himself a lamb for a burnt offering.\u201d \u00b7 Genesis 22:8</div>\n              <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px\">\n                <button onClick=\"{{recallAgain}}\" style=\"height: 44px; border: 1px solid #5A5145; border-radius: 12px; background: transparent; color: #F7F3EC; font: 600 13px Inter, sans-serif\">Again tomorrow</button>\n                <button onClick=\"{{recallGot}}\" style=\"height: 44px; border: none; border-radius: 12px; background: #F2C66B; color: #2A2520; font: 600 13px Inter, sans-serif\">Got it</button>\n              </div>\n            </sc-if>\n            <sc-if value=\"{{hideAnswer}}\" hint-placeholder-val=\"{{true}}\">\n              <button onClick=\"{{doReveal}}\" style=\"height: 44px; border: none; border-radius: 12px; background: #3B342B; color: #F7F3EC; font: 600 13px Inter, sans-serif\">Show answer</button>\n            </sc-if>\n          </div>\n        </div>\n      </sc-if>\n    </div>\n  </sc-if>\n\n  \n  <sc-if value=\"{{isThreads}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"position: absolute; rcle cx=\"6\" cy=\"16\" r=\"2\"></circle><path d=\"M10 7h10M10 16h7M10 11.5h5\"></path></svg></span>Viz\n  </button>\n  <button onClick=\"{{tabStory}}\" style=\"border: none; background: transparent; color: {{inkStory}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 10.5px Inter, sans-serif; padding: 0\">\n    <span style=\"width: 48px; height: 28px; border-radius: 14px; background: {{bgStory}}; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\"></rect><rect x=\"14\" y=\"4\" width=\"7\" height=\"5\" rx=\"1.5\"></rect><rect x=\"3\" y=\"15\" width=\"7\" height=\"5\" rx=\"1.5\"></rect><rect x=\"14\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.5\"></rect></svg></span>Study\n  </button>\n  <button onClick=\"{{tabThreads}}\" style=\"border: none; background: transparent; color: {{inkThreads}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 10.5px Inter, sans-serif; padding: 0\">\n    <span style=\"width: 48px; height: 28px; border-radius: 14px; background: {{bgThreads}}; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"></circle><path d=\"M5.6 7.5C9 10 9 14 6.5 17.5M18.4 7.5C15 10 15 14 17.5 17.5M8 4.5c2.5 3 5.5 3 8 0\"></path></svg></span>Connect\n  </button>\n  <button onClick=\"{{tabMap}}\" style=\"border: none; background: transparent; color: {{inkMap}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 600 10.5px Inter, sans-serif; padding: 0\">\n    <span style=\"width: 48px; height: 28px; border-radius: 14px; background: {{bgMap}}; display: flex; align-items: center; justify-content: center\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z\"></path><path d=\"M9 4v14M15 6v14\"></path></svg></span>Map\n  </button>\n</nav>\n\n\n<sc-if value=\"{{hasItem}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"position: absolute; inset: 0; z-index: 40\">\n    <button aria-label=\"Close\" onClick=\"{{closeItem}}\" style=\"position: absolute; inset: 0; border: none; background: rgba(30,24,16,0.38)\"></button>\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%; overflow-y: auto; background: #FFFDF8; border-radius: 22px 22px 0 0; padding: 10px 18px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DDD3C3\"></div>\n      <div style=\"height: 6px; width: 48px; border-radius: 3px; background: {{item.color}}\"></div>\n      <div>\n        <div style=\"font: 600 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6B6255\">{{itemKind}} \u00b7 {{item.dates}}</div>\n        <div style=\"font: 600 26px/1.15 'Source Serif 4', Georgia, serif; margin-top: 4px\">{{item.name}}</div>\n      </div>\n      <sc-if value=\"{{itemHasQuote}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"font: italic 400 17px/1.5 'Source Serif 4', Georgia, serif; color: #3B342B\">\u201c{{item.quote}}\u201d</div>\n      </sc-if>\n      <div style=\"font: 400 14px/1.55 Inter, sans-serif; color: #3B342B\">{{item.blurb}}</div>\n      <sc-if value=\"{{itemHasRef}}\" hint-placeholder-val=\"{{true}}\">\n        <div style=\"font: 600 13px Inter, sans-serif; color: #1F5E5B\">{{item.ref}}</div>\n      </sc-if>\n      <sc-if value=\"{{hasPassage}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"background: #F7F3EC; border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px\">\n          <div style=\"font: 600 10.5px Inter, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: #8A5A0E\">{{passRef}} \u00b7 KJV</div>\n          <sc-for list=\"{{passage}}\" as=\"pv\" hint-placeholder-count=\"3\">\n            <div style=\"font: 400 15px/1.55 'Source Serif 4', Georgia, serif; color: #2A2520\"><sup style=\"font: 600 10px Inter, sans-serif; color: #A0701A; margin-right: 3px\">{{pv.n}}</sup>{{pv.t}}</div>\n          </sc-for>\n        </div>\n      </sc-if>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px\">\n        <button onClick=\"{{itemZoom}}\" style=\"height: 44px; border: none; border-radius: 12px; background: #1F5E5B; color: #F7F3EC; font: 600 13px Inter, sans-serif\">Zoom in</button>\n        <button onClick=\"{{itemPin}}\" style=\"height: 44px; border: 1px solid #CFE3DF; border-radius: 12px; background: #E3EEEC; color: #1F5E5B; font: 600 13px Inter, sans-serif\">Pin to split</button>\n        <button onClick=\"{{itemRead}}\" style=\"height: 44px; border: 1px solid #E6DED1; border-radius: 12px; background: #FBF8F2; color: #2A2520; font: 600 13px Inter, sans-serif\">Read</button>\n      </div>\n      <div style=\"border-top: 1px solid #EDE6DA; padding-top: 12px; display: flex; flex-direction: column; gap: 8px\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between\">\n          <div style=\"font: 600 13px Inter, sans-serif\">My mark &amp; note</div>\n          <div style=\"display: flex; gap: 2px\">\n            <sc-for list=\"{{markSw}}\" as=\"m\" hint-placeholder-count=\"5\">\n              <button aria-label=\"{{m.label}}\" onClick=\"{{m.pick}}\" style=\"width: 36px; height: 40px; border: none; background: transparent; display: flex; align-items: center; justify-content: center\">\n                <span style=\"width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; background: {{m.c}}; border: {{m.border}}; box-shadow: {{m.ring}}\"></span>\n              </button>\n            </sc-for>\n          </div>\n        </div>\n        <label style=\"font: 500 11px Inter, sans-serif; color: #6B6255\" for=\"tlnote\">Note on this {{itemKindLower}}</label>\n        <textarea id=\"tlnote\" value=\"{{itemNote}}\" onChange=\"{{itemNoteChange}}\" rows=\"3\" placeholder=\"What stands out? Links you noticed?\" style=\"width: 100%; box-sizing: border-box; border: 1px solid #E0D6C5; border-radius: 12px; padding: 10px 12px; background: #FBF8F2; font: 600 19px/1.25 Caveat, cursive; color: #1F5E5B; resize: none\"></textarea>\n      </div>\n    </div>\n  </div>\n</sc-if>\n\n\n<sc-if value=\"{{lens}}\"><dc-import name=\"LensPanel\" b=\"{{lensB}}\" c=\"{{lensC}}\" v=\"{{lensV}}\" book-name=\"{{lensBook}}\" verse-text=\"{{lensKjvVerse}}\" chapter-text=\"{{lensChapText}}\" on-close=\"{{closeLens}}\" open-ref=\"{{openRefFn}}\" get-verse=\"{{getVerseFn}}\" on-thread=\"{{lensThread}}\"></dc-import></sc-if>\n\n\n<sc-if value=\"{{noteEd}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"position: absolute; inset: 0; z-index: 45\">\n    <button aria-label=\"Close\" onClick=\"{{closeNote}}\" style=\"position: absolute; inset: 0; border: none; background: rgba(30,24,16,0.38)\"></button>\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; background: #FFFDF8; border-radius: 22px 22px 0 0; padding: 14px 18px 22px; display: flex; flex-direction: column; gap: 10px\">\n      <label for=\"vnote\" style=\"font: 600 16px 'Source Serif 4', Georgia, serif\">Note on {{selRef}}</label>\n      <textarea id=\"vnote\" value=\"{{selNote}}\" onChange=\"{{noteChange}}\" rows=\"4\" placeholder=\"Write in the margin\u2026\" style=\"width: 100%; box-sizing: border-box; border: 1px solid #E0D6C5; border-radius: 12px; padding: 10px 12px; background: #FBF8F2; font: 600 21px/1.25 Caveat, cursive; color: #1F5E5B; resize: none\"></textarea>\n      <button onClick=\"{{closeNote}}\" style=\"height: 44px; border: none; border-radius: 12px; background: #1F5E5B; color: #F7F3EC; font: 600 14px Inter, sans-serif\">Done</button>\n    </div>\n  </div>\n</sc-if>\n\n\n<sc-if value=\"{{picker}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"position: absolute; inset: 0; z-index: 45\">\n    <button aria-label=\"Close\" onClick=\"{{closePicker}}\" style=\"position: absolute; inset: 0; border: none; background: rgba(30,24,16,0.38)\"></button>\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; overflow-y: auto; background: #FFFDF8; border-radius: 22px 22px 0 0; padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"font: 600 18px 'Source Serif 4', Georgia, serif\">Go to</div>\n      <div style=\"font: 600 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6B6255\">Old Testament</div>\n      <div style=\"display: flex; gap: 5px; flex-wrap: wrap\">\n        <sc-for list=\"{{booksOT}}\" as=\"b\" hint-placeholder-count=\"8\">\n          <button onClick=\"{{b.tap}}\" style=\"height: 32px; padding: 0 10px; border: 1px solid {{b.border}}; border-radius: 16px; background: {{b.bg}}; color: {{b.ink}}; font: 600 11.5px Inter, sans-serif\">{{b.name}}</button>\n        </sc-for>\n      </div>\n      <div style=\"font: 600 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6B6255\">New Testament</div>\n      <div style=\"display: flex; gap: 6px; flex-wrap: wrap\">\n        <sc-for list=\"{{booksNT}}\" as=\"b\" hint-placeholder-count=\"8\">\n          <button onClick=\"{{b.tap}}\" style=\"height: 32px; padding: 0 10px; border: 1px solid {{b.border}}; border-radius: 17px; background: {{b.bg}}; color: {{b.ink}}; font: 600 12px Inter, sans-serif\">{{b.name}}</button>\n        </sc-for>\n      </div>\n      <div style=\"font: 600 11px Inter, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: #6B6255\">{{pickBook}} \u00b7 chapters</div>\n      <div style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px\">\n        <sc-for list=\"{{chapters}}\" as=\"c\" hint-placeholder-count=\"12\">\n          <button onClick=\"{{c.tap}}\" style=\"height: 44px; border: 1px solid {{c.border}}; border-radius: 10px; background: {{c.bg}}; color: {{c.ink}}; font: 600 14px Inter, sans-serif\">{{c.n}}</button>\n        </sc-for>\n      </div>\n    </div>\n  </div>\n</sc-if>\n\n\n<sc-if value=\"{{cardOpen}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"position: absolute; inset: 0; z-index: 47\">\n    <button aria-label=\"Close\" onClick=\"{{closeCard}}\" style=\"position: absolute; inset: 0; border: none; background: rgba(30,24,16,0.38)\"></button>\n    <div style=\"position: absolute; left: 0; right: 0; bottom: 0; max-height: 84%; overflow-y: auto; background: #FFFDF8; border-radius: 22px 22px 0 0; padding: 14px 16px 22px; display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 12px; height: 12px; border-radius: 4px; background: {{cd.color}}\"></span><span style=\"flex: 1; font: 600 16px 'Source Serif 4', Georgia, serif\">{{cd.typeName}}</span></div>\n      <sc-if value=\"{{cd.isVerse}}\" hint-placeholder-val=\"{{false}}\">\n        <label for=\"cref\" style=\"font: 600 11px Inter, sans-serif; color: #6B6255\">Reference</label>\n        <input id=\"cref\" value=\"{{cd.ref}}\" onChange=\"{{cardRefChange}}\" placeholder=\"e.g. John 3:16\" style=\"height: 42px; border: 1px solid #E0D6C5; border-radius: 10px; padding: 0 12px; background: #FBF8F2; font: 500 15px Inter, sans-serif\">\n        <div style=\"font: italic 400 15px/1.5 'Source Serif 4', Georgia, serif; color: #3B342B; background: #F7F3EC; border-radius: 10px; padding: 10px 12px\">{{cd.verse}}</div>\n      </sc-if>\n      <label for=\"ctext\" style=\"font: 600 11px Inter, sans-serif; color: #6B6255\">{{cd.textLabel}}</label>\n      <textarea id=\"ctext\" value=\"{{cd.text}}\" onChange=\"{{cardTextChange}}\" rows=\"3\" placeholder=\"Write here\u2026\" style=\"border: 1px solid #E0D6C5; border-radius: 10px; padding: 10px 12px; background: #FBF8F2; font: 500 15px/1.45 Inter, sans-serif; color: #2A2520; resize: none\"></textarea>\n      <div style=\"font: 600 11px Inter, sans-serif; color: #6B6255\">Link to other cards in this topic</div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n        <sc-for list=\"{{cd.linkChips}}\" as=\"l\" hint-placeholder-count=\"4\">\n          <button onClick=\"{{l.tap}}\" style=\"max-width: 100%; height: 30px; padding: 0 10px; border: 1.5px solid {{l.border}}; border-radius: 15px; background: {{l.bg}}; color: #2A2520; font: 600 11.5px Inter, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{l.label}}</button>\n        </sc-for>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 4px\">\n        <button onClick=\"{{deleteCard}}\" style=\"height: 44px; border: 1px solid #E6DED1; border-radius: 12px; background: transparent; color: #8A2943; font: 600 13px Inter, sans-serif\">Delete card</button>\n        <button onClick=\"{{closeCard}}\" style=\"height: 44px; border: none; border-radius: 12px; background: #1F5E5B; color: #F7F3EC; font: 600 13px Inter, sans-serif\">Done</button>\n      </div>\n    </div>\n  </div>\n</sc-if>\n\n\n<sc-if value=\"{{search}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"position: absolute; inset: 0; z-index: 46\">\n    <button aria-label=\"Close\" onClick=\"{{closeSearch}}\" style=\"position: absolute; inset: 0; border: none; background: rgba(30,24,16,0.38)\"></button>\n    <div style=\"position: absolute; l
